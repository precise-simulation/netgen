name: Release Netgen SDK bundle

on:
  workflow_dispatch:
  push:
    tags:
      - netgen-sdk-*

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NETGEN_BASELINE_TAG: v6.2.2608
  NETGEN_BASELINE_SHA: 96e5682f6ea43ba77ba3bb2ae4bb4bd1791f506e
  WINDOWS_OCCT_URL: https://github.com/precise-simulation/OCCT/releases/download/occt-sdk-8.0.1-r2/occt-combined-release-no-pch.zip
  WINDOWS_OCCT_SHA256: afe36b6abcc7964d0f8b0404ccb16e7c1f6ddd8e43b450c865f7e7f092440e9d
  WINDOWS_STATIC_OCCT_URL: https://github.com/precise-simulation/OCCT/releases/download/occt-sdk-8.0.1-r2/opencascade-8.0.1-windows-x86_64-vc143-static-lean-b8f597c67781.zip
  WINDOWS_STATIC_OCCT_SHA256: a0e7c6ff3e9a93fcf3aa926e20b598b9f6e8cac92b7711782e76f8c1d1cbfa42
  OCCT_RELEASE: occt-sdk-8.0.1-r2
  OCCT_SOURCE_SHA: b8f597c677811d1f9f4d8a97f5ae2825c0353a42

jobs:
  windows:
    name: Windows SDK
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/windows-netgen-sdk.yml
    with:
      bundle_release: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/netgen-sdk-') }}

  linux:
    name: Linux SDK
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/linux-netgen-sdk.yml
    with:
      bundle_release: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/netgen-sdk-') }}

  macos:
    name: macOS SDKs
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/macos-netgen-sdk.yml
    with:
      bundle_release: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/netgen-sdk-') }}

  publish:
    name: Publish combined Netgen SDK release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/netgen-sdk-')
    needs:
      - windows
      - linux
      - macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact release workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download Windows SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: windows-netgen-sdk-*
          path: ${{ runner.temp }}/release-assets/windows
          merge-multiple: true

      - name: Download Linux SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: netgen-linux-sdk-*
          path: ${{ runner.temp }}/release-assets/linux
          merge-multiple: true

      - name: Download macOS SDKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: netgen-macos-sdk-*
          path: ${{ runner.temp }}/release-assets/macos
          merge-multiple: true

      - name: Verify tag and exact release asset inventory
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^netgen-sdk-([0-9a-fA-F]{12})-r([0-9]+)$ ]]; then
            echo "release tag must match netgen-sdk-<12-char-source-sha>-rN" >&2
            exit 1
          fi
          test "${BASH_REMATCH[1],,}" = "$short_sha"

          root="$RUNNER_TEMP/release-assets"
          windows="netgen-featool-v6.2.2608-${short_sha}-occt8.0.1-win64-msvc.zip"
          windows_static="netgen-featool-v6.2.2608-${short_sha}-occt8.0.1-win64-msvc-static.zip"
          linux_shared="netgen-featool-v6.2.2608-${short_sha}-occt8.0.1-linux-x86_64-glibc2.17-gcc10.tar.gz"
          linux_static="netgen-featool-v6.2.2608-${short_sha}-occt8.0.1-linux-x86_64-glibc2.17-gcc10-static.tar.gz"
          mac_x86_shared="netgen-featool-v6.2.2608-${short_sha}-occt8.0.1-macos13-x86_64-clang.tar.gz"
          mac_x86_static="netgen-featool-v6.2.2608-${short_sha}-occt8.0.1-macos13-x86_64-clang-static.tar.gz"
          mac_arm_shared="netgen-featool-v6.2.2608-${short_sha}-occt8.0.1-macos13-arm64-clang.tar.gz"
          mac_arm_static="netgen-featool-v6.2.2608-${short_sha}-occt8.0.1-macos13-arm64-clang-static.tar.gz"

          test -f "$root/windows/$windows"
          test -f "$root/windows/$windows.sha256"
          test -f "$root/windows/$windows_static"
          test -f "$root/windows/$windows_static.sha256"
          for archive in "$linux_shared" "$linux_static"; do
            test -f "$root/linux/$archive"
            test -f "$root/linux/$archive.sha256"
          done
          for archive in "$mac_x86_shared" "$mac_x86_static" "$mac_arm_shared" "$mac_arm_static"; do
            test -f "$root/macos/$archive"
            test -f "$root/macos/$archive.sha256"
          done

          count="$(find "$root" -type f | wc -l | tr -d ' ')"
          test "$count" = 16

          verify_checksum() {
            local archive="$1"
            local sidecar="$archive.sha256"
            local expected actual
            expected="$(awk '{print $1}' "$sidecar" | tr -d '\r')"
            actual="$(sha256sum "$archive" | awk '{print $1}')"
            test "$expected" = "$actual"
          }
          verify_checksum "$root/windows/$windows"
          verify_checksum "$root/windows/$windows_static"
          verify_checksum "$root/linux/$linux_shared"
          verify_checksum "$root/linux/$linux_static"
          verify_checksum "$root/macos/$mac_x86_shared"
          verify_checksum "$root/macos/$mac_x86_static"
          verify_checksum "$root/macos/$mac_arm_shared"
          verify_checksum "$root/macos/$mac_arm_static"

          windows_info="$(unzip -p "$root/windows/$windows" producer-info.json)"
          test "$(jq -r '.source.commit' <<<"$windows_info")" = "$GITHUB_SHA"
          test "$(jq -r '.occt.release' <<<"$windows_info")" = "$OCCT_RELEASE"
          test "$(jq -r '.occt.commit' <<<"$windows_info")" = "$OCCT_SOURCE_SHA"
          test "$(jq -r '.occt.linkage' <<<"$windows_info")" = shared
          test "$(jq -r '.occt.asset_url' <<<"$windows_info")" = "$WINDOWS_OCCT_URL"
          test "$(jq -r '.occt.sha256' <<<"$windows_info")" = "$WINDOWS_OCCT_SHA256"
          windows_static_info="$(unzip -p "$root/windows/$windows_static" producer-info.json)"
          test "$(jq -r '.source.commit' <<<"$windows_static_info")" = "$GITHUB_SHA"
          test "$(jq -r '.netgen.linkage' <<<"$windows_static_info")" = static
          test "$(jq -r '.occt.release' <<<"$windows_static_info")" = "$OCCT_RELEASE"
          test "$(jq -r '.occt.commit' <<<"$windows_static_info")" = "$OCCT_SOURCE_SHA"
          test "$(jq -r '.occt.asset_url' <<<"$windows_static_info")" = "$WINDOWS_STATIC_OCCT_URL"
          test "$(jq -r '.occt.sha256' <<<"$windows_static_info")" = "$WINDOWS_STATIC_OCCT_SHA256"
          test "$(jq -r '.occt.linkage' <<<"$windows_static_info")" = static
          test "$(jq -r '.occt.bundled' <<<"$windows_static_info")" = true
          verify_unix_archive() {
            local archive="$1"
            local linkage="$2"
            local info
            info="$(tar -xOzf "$archive" --wildcards '*/producer-info.json')"
            test "$(jq -r '.source.commit' <<<"$info")" = "$GITHUB_SHA"
            test "$(jq -r '.occt.release' <<<"$info")" = "$OCCT_RELEASE"
            test "$(jq -r '.occt.commit' <<<"$info")" = "$OCCT_SOURCE_SHA"
            test "$(jq -r '.netgen.linkage' <<<"$info")" = "$linkage"
            test "$(jq -r '.occt.linkage' <<<"$info")" = "$linkage"
          }
          verify_unix_archive "$root/linux/$linux_shared" shared
          verify_unix_archive "$root/linux/$linux_static" static
          verify_unix_archive "$root/macos/$mac_x86_shared" shared
          verify_unix_archive "$root/macos/$mac_x86_static" static
          verify_unix_archive "$root/macos/$mac_arm_shared" shared
          verify_unix_archive "$root/macos/$mac_arm_static" static

      - name: Create, verify and publish combined release
        shell: bash
        run: |
          set -euo pipefail
          api_version="2026-03-10"
          draft_id=""

          find_draft_id() {
            gh api --paginate \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -rs --arg tag "$GITHUB_REF_NAME" '
                [ .[][] | select(.tag_name == $tag and .draft == true) ] |
                if length == 1 then .[0].id
                elif length == 0 then empty
                else error("multiple draft releases found for tag")
                end
              '
          }

          verify_remote_tag() {
            local ref_json object_type object_sha tag_json
            ref_json="$(gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            for _ in 1 2 3 4 5; do
              if [[ "$object_type" == commit ]]; then
                break
              fi
              test "$object_type" = tag
              tag_json="$(gh api \
                -H "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            done
            test "$object_type" = commit
            test "$object_sha" = "$GITHUB_SHA"
          }

          existing_draft_id="$(find_draft_id)"
          if [[ -n "$existing_draft_id" ]] || gh api \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi

          mapfile -t assets < <(find "$RUNNER_TEMP/release-assets" -type f -print | sort)
          test "${#assets[@]}" -eq 16
          notes="Netgen native SDK bundle built from source $GITHUB_SHA (upstream baseline $NETGEN_BASELINE_TAG / $NETGEN_BASELINE_SHA)."
          notes="$notes"$'\n\n'"Windows shared OCCT input: precise-simulation/OCCT $OCCT_RELEASE Release/no-PCH archive, SHA-256 $WINDOWS_OCCT_SHA256."
          notes="$notes"$'\n'"Windows static OCCT input: precise-simulation/OCCT $OCCT_RELEASE lean vc143 static /MD archive, SHA-256 $WINDOWS_STATIC_OCCT_SHA256."
          notes="$notes"$'\n'"Linux/macOS OCCT input: precise-simulation/OCCT $OCCT_RELEASE, source $OCCT_SOURCE_SHA."
          notes="$notes"$'\n\n'"Windows: x64 VS2022 Release /MD, shared and static SDKs."
          notes="$notes"$'\n'"Linux: x86_64 shared and static SDKs, manylinux2014 / glibc 2.17 / GCC 10 baseline."
          notes="$notes"$'\n'"macOS: thin x86_64 and arm64 shared and static SDKs targeting macOS 13.0 with Xcode 16.4."
          notes="$notes"$'\n\n'"Each archive has a SHA-256 sidecar and was re-extracted and qualified through the native OCC consumer."

          verify_remote_tag
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Netgen v6.2.2608 SDKs - Windows, Linux, macOS" \
            --notes "$notes"

          draft_id="$(find_draft_id)"
          test -n "$draft_id"
          release_json="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = true
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$GITHUB_REF_NAME"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 16
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$actual" = "$expected"
          done

          verify_remote_tag
          gh api -X PATCH \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false >/dev/null

          release_json="$(gh api -H "X-GitHub-Api-Version: $api_version" "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$GITHUB_REF_NAME"
          test "$(jq '.assets | length' <<<"$release_json")" -eq 16
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            test "$actual" = "$expected"
          done
          verify_remote_tag
